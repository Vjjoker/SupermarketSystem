<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增用户 - 超市管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="border-strip"></div>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" style="width:50px;">
                <h5 class="mt-2">系统管理员</h5>
            </div>
            <ul class="list-unstyled components">
                <li><a href="/admin"><img src="{{ url_for('static', filename='images/nav-user.png') }}" width="20"> 用户账号管理</a></li>
                <li><a href="/logout"><img src="{{ url_for('static', filename='images/nav-logout.png') }}" width="20"> 退出系统</a></li>
            </ul>
        </nav>

        <div id="content">
            <h3 style="color: #ff1493;">新增员工账号</h3>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="form-card">
                <form method="post" action="/admin/add">
                    <div class="mb-3">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required value="{{ username or '' }}" placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required placeholder="请输入密码">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" name="real_name" class="form-control" value="{{ real_name or '' }}" placeholder="请输入真实姓名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">角色 <span class="text-danger">*</span></label>
                        <select name="role" class="form-select" required>
                            <option value="">-- 请选择角色 --</option>
                            <option value="manager" {% if role == 'manager' %}selected{% endif %}>超市主管</option>
                            <option value="sales" {% if role == 'sales' %}selected{% endif %}>销售人员</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" style="background-color: #ff69b4; border:none;">确认添加</button>
                        <a href="/admin" class="btn btn-outline-secondary">取消返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="border-strip"></div>
</body>
</html>
