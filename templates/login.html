<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超市商品销售管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="border-strip"></div>

    <div class="main-container">
        <div class="login-card text-center">
            
            <img src="{{ url_for('static', filename='images/kitty-peek.png') }}" class="kitty-peek" alt="Peek">

            <div class="mb-4">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="width: 70px;">
                <h2 class="mt-2 fw-bold" style="color: #ff1493; letter-spacing: 2px;">超市商品销售管理系统</h2>
                <small class="text-muted text-uppercase">Management System V1.0</small>
            </div>

            <form method="post">
                {% if error %}
                    <div class="alert alert-danger py-1 mb-3" style="font-size: 14px;">{{ error }}</div>
                {% endif %}
                
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="userInput" placeholder="Username" required>
                    <label for="userInput">账号</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="passInput" placeholder="Password" required>
                    <label for="passInput">密码</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="border-radius: 50px; background-color: #ff69b4; border: none;">
                    开启粉色管理之旅
                </button>

                <div class="mt-3 small text-muted" style="line-height: 1.7;">
                    <div>系统管理员用户名：admin</div>
                    <div>密码：admin123</div>
                    <div>其余角色初始密码：123456</div>
                </div>
            </form>

            <div class="role-preview">
                <div class="role-item">
                    <img src="{{ url_for('static', filename='images/role-admin.png') }}" alt="Admin">
                    <span>系统管理员</span>
                </div>
                <div class="role-item">
                    <img src="{{ url_for('static', filename='images/role-manager.png') }}" alt="Manager">
                    <span>超市主管</span>
                </div>
                <div class="role-item">
                    <img src="{{ url_for('static', filename='images/role-sales.png') }}" alt="Sales">
                    <span>销售人员</span>
                </div>
            </div>
        </div>
    </div>

    <div class="border-strip"></div>
</body>
</html>
